[project]
name = "droitclair-rag-travail"
version = "0.1.0"
description = "Assistant RAG sur le contrat de travail en droit français, à partir de sources officielles citées."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]
ml = [
    "sentence-transformers>=6.2.0",
]
ui = [
    "chainlit>=2.12.0",
]

[tool.uv]
# `ml` (sentence-transformers + torch) and `ui` (chainlit) are installed locally by default; CI skips them.
default-groups = ["dev", "ml", "ui"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ingestion"]

# --- Ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "ASYNC",    # async pitfalls
    "PTH",      # pathlib
    "RUF",
]
ignore = [
    # French user-facing text and prompts legitimately contain typographic characters (’ — « »).
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"infra/alembic/versions/*.py" = ["E501", "F401"]

# --- Mypy -------------------------------------------------------------------

[tool.mypy]
strict = true
files = ["app", "ingestion"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- Pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["--strict-markers", "-ra"]
markers = [
    "integration: requires a PostgreSQL + pgvector database (TEST_DATABASE_URL)",
]

# --- Alembic ----------------------------------------------------------------

[tool.alembic]
script_location = "%(here)s/infra/alembic"
prepend_sys_path = ["."]
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s"

# Local development stack.
#
#   docker compose -f infra/docker-compose.yml up -d            # PostgreSQL + pgvector only
#   docker compose -f infra/docker-compose.yml --profile api up  # + the FastAPI backend
#
# Langfuse (self-hosted) and Chainlit are added in later phases.

name: droitclair

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    ports:
      # Host port 5433: avoids clashing with a native PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["api"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://chatbot:chatbot@db:5432/chatbot
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
